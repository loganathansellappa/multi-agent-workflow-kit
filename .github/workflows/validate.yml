name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify gate (lint + tests + capability contract)
        run: python scripts/verify.py

      - name: Secret / leak scan
        shell: bash
        run: |
          if git ls-files | grep -E '\.secrets|\.token$|agents\.config\.yaml$'; then
            echo "Leaked tracked files found"
            exit 1
          fi
          echo "No secrets/real config tracked."
